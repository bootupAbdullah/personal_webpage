name: Deploy to VM

on:
  # Manual only until DNS is cut over. Then add:
  #   push:
  #     branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bootupabdullah/akddev-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VM
        run: |
          SSH="ssh -i ~/.ssh/id_deploy ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}"
          $SSH 'mkdir -p ~/akddev'
          scp -i ~/.ssh/id_deploy deploy/docker-compose.yml deploy/Caddyfile \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/akddev/
          $SSH "cd ~/akddev \
            && echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
            && docker compose pull akddev-site \
            && docker compose up -d \
            && docker image prune -f"
